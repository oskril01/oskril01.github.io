<script>
document.querySelectorAll('.pan-wrapper').forEach(wrapper => {
  // Programmatic scrolling shouldn't be "smooth"
  wrapper.style.scrollBehavior = 'auto';

  const baseSpeed = 0.5;   // min speed (px/ms)
  let speed = baseSpeed;   // current speed (px/ms), modulated by mouse
  let dir = 1;             // 1 = right, -1 = left
  let paused = false;

  // Wait for images so widths are accurate
  const imgs = [...wrapper.querySelectorAll('img')];
  Promise.all(imgs.map(img =>
    img.complete ? Promise.resolve()
                 : new Promise(res => { img.addEventListener('load', res, {once:true}); img.addEventListener('error', res, {once:true}); })
  )).then(setup);

  function setup() {
    // Measure original content width
    const originals = [...wrapper.children].map(n => n.cloneNode(true));
    const originalWidth = [...wrapper.children].reduce((w, el) => w + el.getBoundingClientRect().width, 0);

    // Duplicate until we have >2× content width (gives room to loop)
    while (wrapper.scrollWidth < originalWidth * 2 + wrapper.clientWidth) {
      originals.forEach(node => wrapper.appendChild(node.cloneNode(true)));
    }

    let wrapWidth = originalWidth; // amount to modulo/wrap by

    // Edge-tracking speed + direction
    wrapper.addEventListener('mousemove', e => {
      const r = wrapper.getBoundingClientRect();
      const center = r.width / 2;
      const x = e.clientX - r.left;
      const scale = Math.abs(x - center) / center; // 0 at center → 1 at edges
      const maxSpeed = 0.003 * r.width + baseSpeed; // scale with width a bit
      speed = baseSpeed + (maxSpeed - baseSpeed) * scale;
      dir = x >= center ? 1 : -1; // right side → scroll right, left → left
    });
    wrapper.addEventListener('mouseleave', () => { speed = baseSpeed; dir = 1; });

    // Optional hard pause on hover/touch (set paused=true if you want a full stop)
    wrapper.addEventListener('mouseenter', () => { /* paused = true; */ });
    wrapper.addEventListener('mouseleave',  () => { paused = false; });
    wrapper.addEventListener('touchstart', () => { paused = true; }, {passive:true});
    wrapper.addEventListener('touchend',   () => { paused = false; });

    // Recompute wrapWidth on resize (responsive images)
    window.addEventListener('resize', () => {
      const firstRunWidth = [...wrapper.children]
        .slice(0, originals.length)
        .reduce((w, el) => w + el.getBoundingClientRect().width, 0);
      wrapWidth = firstRunWidth || wrapWidth;
    });

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(40, now - last); // clamp delta (ms)
      last = now;

      if (!paused) {
        wrapper.scrollLeft += dir * speed * dt; // px/ms × ms = px

        // Seamless wrap: shift by exactly one "original width"
        if (wrapper.scrollLeft >= wrapWidth) {
          wrapper.scrollLeft -= wrapWidth;
        } else if (wrapper.scrollLeft <= 0) {
          wrapper.scrollLeft += wrapWidth;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
});
</script>

</body>
