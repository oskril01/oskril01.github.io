    </div>
    
  </main>

<script>
document.querySelectorAll('.pan-wrapper').forEach(wrapper => {
  const speed = 0.5; // pixels per frame; increase for faster scroll
  let scrollPos = 0;

  // Duplicate the images for seamless looping
  const clone = wrapper.innerHTML;
  wrapper.innerHTML += clone;

  function autoScroll() {
    scrollPos += speed;
    if (scrollPos >= wrapper.scrollWidth / 2) {
      scrollPos = 0; // reset scroll to start
    }
    wrapper.scrollLeft = scrollPos;
    requestAnimationFrame(autoScroll);
  }

  autoScroll();
});
</script>
